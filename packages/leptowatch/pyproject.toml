[project]
name = "leptowatch"
version = "1.0.0"
description = "Leptospirosis surge early warning for Sri Lankan RDHS areas (ModelX 2.0, team RootBotZ)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
