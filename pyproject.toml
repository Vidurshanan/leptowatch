[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leptowatch-platform"
version = "0.1.0"
description = "Sri Lanka Leptospirosis Surveillance and Forecasting Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "LeptoWatch Development Team"}
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
